services:
  - type: web
    name: ecovision-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: MODEL_VERSION
        value: 1.0.0-mobilenetv2

